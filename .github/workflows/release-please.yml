name: Release & Publish

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Build & Publish to PyPI
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/resmi-gazete-cli/
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build and validation tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify code quality before release
        run: |
          pip install flake8 pytest pytest-asyncio -e .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution packages with Twine
        run: twine check --strict dist/*

      - name: Test installation from wheel in isolated environment
        run: |
          python -m venv test_env
          test_env/bin/pip install --upgrade pip
          test_env/bin/pip install dist/*.whl
          test_env/bin/resmi-gazete-cli --version

      - name: Upload artifacts to GitHub Release
        if: ${{ needs.release-please.outputs.tag_name != '' || github.event_name == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name || github.event.release.tag_name }}"
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" dist/* --clobber || echo "Release upload skipped or assets already exist."
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: true
          verbose: true
          password: ${{ secrets.PYPI_API_TOKEN }}
