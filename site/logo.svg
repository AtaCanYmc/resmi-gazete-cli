<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>

    <!-- Crimson Official Seal Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Sheet Surface Gradient Left -->
    <linearGradient id="sheetLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Sheet Surface Gradient Right -->
    <linearGradient id="sheetRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Cyan CLI Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />

  <!-- Corner Precision Marks -->
  <path d="M 64 36 L 44 36 A 8 8 0 0 0 36 44 L 36 64" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M 448 36 L 468 36 A 8 8 0 0 1 476 44 L 476 64" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M 36 448 L 36 468 A 8 8 0 0 0 44 476 L 64 476" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M 476 448 L 476 468 A 8 8 0 0 1 468 476 L 448 476" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Official Seal Crest / Header Emblem -->
  <g transform="translate(256, 88)">
    <!-- Crimson Disc -->
    <circle cx="0" cy="0" r="32" fill="url(#crimsonGrad)" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="32" fill="url(#crimsonGrad)" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Crescent and Star -->
    <!-- Crescent -->
    <path d="M 4 -15 A 16 16 0 1 0 4 15 A 12.5 12.5 0 1 1 4 -15 Z" fill="#FFFFFF" />
    <!-- Star -->
    <polygon points="9,-2 13,3 8,6 10,12 5,8 0,11 2,5 -3,2 3,-1 4,-7" fill="#FFFFFF" transform="translate(4, -2) scale(0.7)" />
  </g>

  <!-- Gazette Folio Body (Open Ledger) -->
  <g id="gazette-pages" transform="translate(0, 10)">
    <!-- Center Spine Shadow -->
    <rect x="254" y="152" width="4" height="196" fill="#020617" opacity="0.8" />

    <!-- Left Page -->
    <path d="M 96 164 Q 176 156 254 152 L 254 348 Q 176 352 96 360 Z" fill="url(#sheetLeft)" stroke="#334155" stroke-width="1.5" />

    <!-- Right Page -->
    <path d="M 416 164 Q 336 156 258 152 L 258 348 Q 336 352 416 360 Z" fill="url(#sheetRight)" stroke="#334155" stroke-width="1.5" />

    <!-- Left Page Content: Legal Columns (Structured Micro-bars) -->
    <!-- Column 1 -->
    <rect x="120" y="188" width="54" height="4" rx="2" fill="#94A3B8" opacity="0.8" />
    <rect x="120" y="202" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="120" y="214" width="54" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="120" y="226" width="44" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="120" y="238" width="52" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="120" y="250" width="38" height="3" rx="1.5" fill="#64748B" opacity="0.6" />

    <!-- Column 2 -->
    <rect x="186" y="188" width="52" height="4" rx="2" fill="#94A3B8" opacity="0.8" />
    <rect x="186" y="202" width="52" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="186" y="214" width="46" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="186" y="226" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="186" y="238" width="42" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="186" y="250" width="48" height="3" rx="1.5" fill="#64748B" opacity="0.6" />

    <!-- Left Page Lower Article -->
    <rect x="120" y="272" width="118" height="3.5" rx="1.5" fill="#F59E0B" opacity="0.8" />
    <rect x="120" y="284" width="114" height="3" rx="1.5" fill="#64748B" opacity="0.5" />
    <rect x="120" y="296" width="108" height="3" rx="1.5" fill="#64748B" opacity="0.5" />
    <rect x="120" y="308" width="96" height="3" rx="1.5" fill="#64748B" opacity="0.5" />

    <!-- Right Page Content: Legal Columns -->
    <!-- Column 3 -->
    <rect x="274" y="188" width="52" height="4" rx="2" fill="#94A3B8" opacity="0.8" />
    <rect x="274" y="202" width="48" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="274" y="214" width="52" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="274" y="226" width="44" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="274" y="238" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="274" y="250" width="40" height="3" rx="1.5" fill="#64748B" opacity="0.6" />

    <!-- Column 4 -->
    <rect x="340" y="188" width="54" height="4" rx="2" fill="#94A3B8" opacity="0.8" />
    <rect x="340" y="202" width="52" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="340" y="214" width="46" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="340" y="226" width="54" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="340" y="238" width="38" height="3" rx="1.5" fill="#64748B" opacity="0.6" />
    <rect x="340" y="250" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.6" />

    <!-- Right Page Lower Article -->
    <rect x="274" y="272" width="120" height="3.5" rx="1.5" fill="#38BDF8" opacity="0.8" />
    <rect x="274" y="284" width="116" height="3" rx="1.5" fill="#64748B" opacity="0.5" />
    <rect x="274" y="296" width="112" height="3" rx="1.5" fill="#64748B" opacity="0.5" />
    <rect x="274" y="308" width="92" height="3" rx="1.5" fill="#64748B" opacity="0.5" />
  </g>

  <!-- Modern CLI Terminal Dock (Bridge between Law & Terminal) -->
  <g transform="translate(96, 372)">
    <!-- Terminal Container Card -->
    <rect x="0" y="0" width="320" height="64" rx="14" fill="#030712" stroke="#1E293B" stroke-width="1.5" />
    <rect x="1" y="1" width="318" height="62" rx="13" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />

    <!-- Terminal Window Dots -->
    <circle cx="20" cy="32" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="34" cy="32" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="48" cy="32" r="4.5" fill="#10B981" opacity="0.85" />

    <!-- Terminal Command Line -->
    <g transform="translate(68, 22)">
      <!-- Prompt glyph ">" -->
      <path d="M 0 3 L 7 10 L 0 17" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Command Text -->
      <text x="16" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, monospace" font-size="14.5" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">resmi-gazete</text>

      <!-- Subtitle badge "CLI" -->
      <rect x="122" y="2" width="34" height="16" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="128" y="14" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">CLI</text>

      <!-- Blinking Cursor "_" -->
      <rect x="164" y="4" width="8" height="14" rx="1" fill="#34D399">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Bottom Brand Title -->
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3">T.C. RESMÎ GAZETE &amp; MCP</text>
</svg>
