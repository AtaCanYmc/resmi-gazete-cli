[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resmi-gazete-cli"
version = "0.1.0"
description = "T.C. Resmi Gazete Karar, Kanun ve İlan Scraper, CLI ve MCP Sunucusu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ata Can Yaymacı" }
]
dependencies = [
    "httpx>=0.25.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.5.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "mcp[cli]>=0.5.0"
]

[project.scripts]
resmi-gazete-cli = "resmi_gazete_cli.cli.main:cli"
resmi-gazete-mcp = "resmi_gazete_cli.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
