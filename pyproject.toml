[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resmi-gazete-cli"
version = "0.1.2"
description = "T.C. Resmi Gazete Karar, Kanun ve İlan Scraper, CLI ve MCP Sunucusu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ata Can Yaymacı" }
]
keywords = ["resmi-gazete", "mevzuat", "kanun", "karar", "scraper", "cli", "mcp", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]

dependencies = [
    "httpx>=0.25.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.5.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "mcp[cli]>=0.5.0"
]

[project.urls]
Homepage = "https://github.com/AtaCanYmc/resmi-gazete-cli"
Documentation = "https://atacanymc.github.io/resmi-gazete-cli/"
Repository = "https://github.com/AtaCanYmc/resmi-gazete-cli.git"
Issues = "https://github.com/AtaCanYmc/resmi-gazete-cli/issues"
Changelog = "https://github.com/AtaCanYmc/resmi-gazete-cli/blob/main/CHANGELOG.md"
"PyPI Profil" = "https://pypi.org/user/atacanymc/"

[project.scripts]
resmi-gazete-cli = "resmi_gazete_cli.cli.main:cli"
resmi-gazete-mcp = "resmi_gazete_cli.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
